<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방문카운트쿠키</title>
    <style>
        body {
            background: linear-gradient(135deg, skyblue, pink, lavender);
            min-height: 100vh;
        }
    </style>
    <script>
        function GetCookie(name) {
            var pairs = document.cookie.split(";");

            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].trim();
                var unit = pair.split("=");

                if (unit[0] == name)
                    return decodeURIComponent(unit[1]);
            }
            return null;
        }

        function SetCookie(name, value, expireDate) {
            var cookieStr = name + "=" + encodeURIComponent(value) +
                ((expireDate == null) ? "" : ("; expires=" + expireDate.toUTCString()));

            document.cookie = cookieStr + "; path=/";
        }
    </script>
</head>
<body>
    <script>
        var username = GetCookie("username");
        var count = Number(GetCookie("count")) || 0;
        var expire = new Date();

        if (username == null) {
            count = 0;
            username = prompt("이름을 입력해주십시오.", "");

            if (username == null || username == "") {
                alert("이름을 입력하시면 보다 나은 서비스를 제공받을 수 있습니다.");
                username = "아무개";
            }

            expire.setTime(expire.getTime() + (365 * 24 * 3600 * 1000));
            SetCookie("username", username, expire);
        }

        count++;

        expire.setTime(expire.getTime() + (365 * 24 * 3600 * 1000));
        SetCookie("count", count, expire);

        var message = document.createElement("p");
        message.textContent = "어서오십시오. " + username + "님의 " + count + "번째 방문을 환영합니다!";
        document.body.appendChild(message);
    </script>
</body>
</html>
