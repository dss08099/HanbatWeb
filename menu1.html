<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head><title>방문카운트쿠키</title>
<script>
function GetCookie(name) {
varstr= name+"=";
varpairs = document.cookie.split(";"); // 쿠키문자열을;을경계로분할
for(var i=0; i<pairs.length; i++) {
varpair = pairs[i].trim(); // 쿠키앞뒤의빈칸제거
varunit = pair.split("=");
if(unit[0] == name)
return unescape(unit[1]);
}
return null;
}
function SetCookie(name, value, expireDate) {
varcookieStr= name + "=" + escape(value) + 
((expireDate== null)?"":("; expires=" + expireDate.toGMTString()));
document.cookie= cookieStr;
}
</script></head>
  <body>
<script>
varusername = GetCookie("username");
varcount = GetCookie("count");
varexpire = new Date (); // 현재시간
if (username == null) {
count = 0;
username = prompt("이름을입력해주십시오.","");
if (username == null) {
alert("이름을입력하시면보다나은서비스를제공받을수있습니다.");
username = "아무개";
} else {
expire.setTime(expire.getTime() + (365 * 24 * 3600 * 1000)); // 1년후
SetCookie("username",username,expire);
}
}
count++;
expire.setTime(expire.getTime() + (365 * 24 * 3600 * 1000)); // 1년후
SetCookie("count",count,expire);
document.write('<p>어서오십시오. '+username+'님의'+count+'번째
방문을환영합니다!');
</script>
</body>
</html>
